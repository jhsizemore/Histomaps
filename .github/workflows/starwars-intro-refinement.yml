name: Star Wars intro refinement

on:
  push:
    paths:
      - '.github/workflows/starwars-intro-refinement.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refine opening intro
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('StarWars/index.html')
          text=p.read_text()

          new_style='''  <style id="launch-experience-styles">
    .atlas{position:relative}
    .launch-intro{position:absolute;inset:0 0 26px;z-index:24;display:grid;place-items:center;overflow:auto;padding:clamp(16px,4vw,48px);background:#000;isolation:isolate}
    .launch-intro[hidden]{display:none}
    .launch-intro-bg{position:absolute;inset:0;z-index:-2;background-image:linear-gradient(180deg,#0002,#0008 74%,#000d),url('assets/starfield.webp');background-size:cover,cover;background-position:center;filter:saturate(.82) contrast(1.04)}
    .launch-intro:after{content:'';position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 50% 46%,transparent 0 24%,#0003 60%,#0009 100%);pointer-events:none}
    .launch-card{position:relative;width:min(920px,100%);padding:clamp(24px,4vw,48px) clamp(22px,5vw,58px) clamp(22px,4vw,40px);background:linear-gradient(180deg,#0007,#0003);box-shadow:0 26px 90px #000c;text-align:center}
    .launch-close{position:absolute;right:10px;top:6px;width:40px;height:40px;font-size:28px;color:#71848b;z-index:2}
    .launch-close:hover{color:#d6e3e5}
    .launch-eyebrow{display:block;margin-bottom:clamp(16px,2vw,24px);font-size:11px;letter-spacing:2.2px;color:#77868a}
    .launch-opening-line{max-width:720px;margin:0 auto clamp(18px,2.8vw,30px);font:400 clamp(21px,3vw,31px)/1.35 Arial,Helvetica,sans-serif;letter-spacing:.2px;color:#4bd5ee;text-wrap:balance;text-shadow:0 0 18px #4bd5ee22}
    .launch-lockup{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;margin:0 auto clamp(14px,2vw,22px);color:#ffe81f}
    .launch-lockup img{display:block;width:clamp(150px,24vw,240px);height:auto;max-height:104px;object-fit:contain}
    .launch-histomap-word{font:400 clamp(25px,3.7vw,42px)/1 'Pathway Gothic One','News Cycle',Arial,sans-serif;letter-spacing:clamp(5px,.8vw,9px);text-indent:clamp(5px,.8vw,9px);color:#ffe81f;text-shadow:0 0 15px #ffe81f22}
    .launch-crawl-window{max-width:770px;margin:0 auto clamp(18px,2.8vw,28px);perspective:520px;perspective-origin:50% 100%;overflow:visible}
    .launch-crawl{transform-origin:50% 100%;transform:rotateX(18deg) scale(.98,1.015);color:#ffe81f;font-family:'Pathway Gothic One','News Cycle',Arial,sans-serif;text-shadow:0 0 10px #ffe81f16}
    .launch-crawl-title{margin:0 0 8px;font-size:clamp(17px,2vw,22px);font-weight:700;letter-spacing:2.3px;text-align:center}
    .launch-deck{max-width:740px;margin:0 auto;font-size:clamp(18px,2.25vw,25px);font-weight:700;line-height:1.38;text-align:justify;text-align-last:center;text-wrap:pretty}
    .launch-crawl-note{max-width:680px;margin:10px auto 0;font-size:clamp(14px,1.6vw,18px);line-height:1.4;text-align:center;color:#f8df24}
    .launch-actions{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:4px}
    .launch-primary,.launch-secondary{min-height:46px;padding:11px 18px;border-radius:2px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:10px;letter-spacing:.15px}
    .launch-primary{background:#ffe81f;color:#070707;border:1px solid #ffe81f}.launch-primary:hover{background:#fff16b;color:#000}
    .launch-secondary{border:1px solid #4bd5ee88;color:#7ce4f5;background:#0009}.launch-secondary:hover{border-color:#4bd5ee;color:#b9f3fb}
    .launch-foot{display:flex;justify-content:space-between;gap:20px;margin-top:24px;padding-top:13px;border-top:1px solid #44545a55;color:#718087;font-size:11px;text-align:left}
    @media(max-width:700px){
      .launch-intro{align-items:start;padding:10px}
      .launch-card{padding:22px 16px 18px;margin:auto 0}
      .launch-eyebrow{margin-bottom:14px;font-size:9px}
      .launch-opening-line{font-size:21px;margin-bottom:16px;padding:0 8px}
      .launch-lockup{margin-bottom:10px}.launch-lockup img{width:145px;max-height:64px}.launch-histomap-word{font-size:26px;letter-spacing:5px;text-indent:5px}
      .launch-crawl-window{perspective:430px;margin-bottom:15px;padding:0 7px}.launch-crawl{transform:rotateX(14deg)}
      .launch-crawl-title{font-size:15px;margin-bottom:5px}.launch-deck{font-size:18px;line-height:1.3}.launch-crawl-note{font-size:13px;line-height:1.32;margin-top:7px}
      .launch-actions{display:grid;gap:8px}.launch-primary,.launch-secondary{width:100%;min-height:43px;padding:9px 13px}
      .launch-foot{display:grid;gap:4px;margin-top:14px;padding-top:9px;font-size:10px;text-align:center}
    }
    @media(max-height:700px) and (orientation:landscape){
      .launch-intro{padding:5px;align-items:center}.launch-card{width:min(790px,calc(100% - 8px));padding:8px 24px 10px}
      .launch-close{top:1px;right:5px}.launch-eyebrow{display:none}.launch-opening-line{font-size:17px;line-height:1.2;margin-bottom:5px}
      .launch-lockup{flex-direction:row;gap:12px;margin-bottom:3px}.launch-lockup img{width:92px;max-height:38px}.launch-histomap-word{font-size:22px;letter-spacing:4px;text-indent:4px}
      .launch-crawl-window{perspective:500px;margin-bottom:4px;max-width:650px}.launch-crawl{transform:rotateX(11deg)}
      .launch-crawl-title{font-size:12px;margin-bottom:2px}.launch-deck{font-size:14px;line-height:1.2;max-width:650px}.launch-crawl-note{font-size:11px;line-height:1.18;margin-top:3px}
      .launch-actions{margin-top:4px}.launch-primary,.launch-secondary{min-height:35px;padding:5px 11px;font-size:12px}.launch-foot{display:none}
    }
    @media(prefers-reduced-motion:no-preference){
      .launch-opening-line{animation:launch-blue-in .6s ease-out both}
      .launch-lockup{animation:launch-logo-in .55s .08s ease-out both}
      .launch-crawl{animation:launch-crawl-settle .65s .14s ease-out both}
      @keyframes launch-blue-in{from{opacity:0}to{opacity:1}}
      @keyframes launch-logo-in{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
      @keyframes launch-crawl-settle{from{opacity:0;transform:rotateX(22deg) translateY(10px) scale(.97,1.01)}to{opacity:1;transform:rotateX(18deg) scale(.98,1.015)}}
    }
    @media(max-width:700px) and (prefers-reduced-motion:no-preference){@keyframes launch-crawl-settle{from{opacity:0;transform:rotateX(18deg) translateY(8px)}to{opacity:1;transform:rotateX(14deg)}}}
    @media(max-height:700px) and (orientation:landscape) and (prefers-reduced-motion:no-preference){@keyframes launch-crawl-settle{from{opacity:0;transform:rotateX(15deg) translateY(5px)}to{opacity:1;transform:rotateX(11deg)}}}
  </style>'''

          text,n=re.subn(r'  <style id="launch-experience-styles">.*?  </style>',new_style,text,count=1,flags=re.S)
          assert n==1, 'launch style block not replaced'

          old='''          <span class="launch-eyebrow">UNOFFICIAL FAN ATLAS · STORY SPOILERS</span>
          <div class="launch-lockup"><img src="title-art/main.webp" alt="Star Wars" width="586" height="254"><span>HISTOMAP</span></div>
          <h2 id="launch-title">The history of the Star Wars galaxy, all at once.</h2>
          <p class="launch-deck">Follow powers as they rise, fracture, transform, and fall — with films and television, character lifelines, and separate Legends histories locked to the same chronology.</p>
          <div class="launch-features" aria-label="Atlas contents"><span>Canon · 500 BBY—35 ABY</span><span>Films &amp; TV</span><span>Character lifelines</span><span>Legends kept separate</span></div>'''
          new='''          <span class="launch-eyebrow">UNOFFICIAL FAN ATLAS · STORY SPOILERS</span>
          <h2 id="launch-title" class="launch-opening-line">A long time ago in a galaxy far, far away....</h2>
          <div class="launch-lockup"><img src="title-art/main.webp" alt="Star Wars" width="586" height="254"><span class="launch-histomap-word">HISTOMAP</span></div>
          <div class="launch-crawl-window" aria-label="Introduction to the atlas">
            <div class="launch-crawl">
              <p class="launch-crawl-title">A HISTOMAP OF GALACTIC HISTORY</p>
              <p class="launch-deck">Follow the rise and fall of republics and empires, insurgent movements and religious orders, and the heroes caught between them — across a galaxy stretching from the Core Worlds to the Outer Rim.</p>
              <p class="launch-crawl-note">From 500 BBY to 35 ABY, films and television, character lifelines, and separate Legends histories share one chronology.</p>
            </div>
          </div>'''
          assert old in text, 'launch markup target not found'
          text=text.replace(old,new,1)
          text=text.replace("starwars-histomap-intro-v1","starwars-histomap-intro-v2")
          p.write_text(text)
          PY

      - name: Validate source
        run: |
          grep -Fq 'A long time ago in a galaxy far, far away....' StarWars/index.html
          grep -Fq 'class="launch-histomap-word">HISTOMAP' StarWars/index.html
          grep -Fq 'transform:rotateX(18deg)' StarWars/index.html
          grep -Fq 'starwars-histomap-intro-v2' StarWars/index.html
          ! grep -Fq 'launch-features' StarWars/index.html
          git diff --check

      - name: Install Playwright
        run: python -m pip install --disable-pip-version-check playwright

      - name: Visual QA
        run: |
          python -m http.server 8000 --directory . >/tmp/starwars-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          out=Path('/tmp/intro-qa'); out.mkdir()
          sizes=[('desktop',1440,900),('mobile',390,844),('landscape',844,390)]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,executable_path='/usr/bin/google-chrome')
              for name,w,h in sizes:
                  page=browser.new_page(viewport={'width':w,'height':h})
                  page.goto('http://127.0.0.1:8000/StarWars/',wait_until='networkidle')
                  page.evaluate("sessionStorage.clear()")
                  page.reload(wait_until='networkidle')
                  page.evaluate("document.getAnimations().forEach(a=>a.finish())")
                  intro=page.locator('#launch-intro')
                  assert intro.is_visible()
                  assert page.locator('#launch-title').inner_text()=='A long time ago in a galaxy far, far away....'
                  assert page.locator('.launch-histomap-word').inner_text()=='HISTOMAP'
                  styles=page.locator('.launch-histomap-word').evaluate("e=>({font:getComputedStyle(e).fontFamily,color:getComputedStyle(e).color})")
                  assert 'Star Jedi' not in styles['font'], styles
                  assert page.locator('.launch-crawl').evaluate("e=>getComputedStyle(e).transform")!='none'
                  box=page.locator('.launch-card').bounding_box()
                  assert box and box['height'] <= h-8, (name,box,h)
                  page.screenshot(path=str(out/f'{name}.png'),full_page=False)
              browser.close()
          PY

      - name: Upload QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: starwars-intro-refinement-qa
          path: /tmp/intro-qa/*.png
          retention-days: 3

      - name: Commit refinement
        run: |
          if git diff --quiet -- StarWars/index.html; then
            echo 'No source change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add StarWars/index.html
          git commit -m 'Refine Star Wars opening intro'
          git pull --rebase origin main
          git push
