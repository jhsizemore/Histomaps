name: Star Wars intro refinement

on:
  push:
    paths:
      - '.github/workflows/starwars-intro-refinement.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply intro refinement
        run: python StarWars/tools/intro_refine.py
      - name: Validate source
        run: |
          grep -Fq 'A long time ago in a galaxy far, far away....' StarWars/index.html
          grep -Fq 'class="launch-histomap-word">HISTOMAP' StarWars/index.html
          grep -Fq 'transform:rotateX(18deg)' StarWars/index.html
          grep -Fq 'starwars-histomap-intro-v2' StarWars/index.html
          git diff --check
      - name: Install Playwright
        run: python -m pip install --disable-pip-version-check playwright
      - name: Visual QA
        run: |
          python -m http.server 8000 --directory . >/tmp/starwars-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python StarWars/tools/intro_qa.py
      - name: Upload QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: starwars-intro-refinement-qa
          path: /tmp/intro-qa/*.png
          retention-days: 3
      - name: Commit refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add StarWars/index.html
          git commit -m 'Refine Star Wars opening intro'
          git pull --rebase origin main
          git push
