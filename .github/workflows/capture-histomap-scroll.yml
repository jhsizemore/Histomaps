name: Capture Histomap Scroll

on:
  push:
    branches:
      - video/histomap-scroll-2026-08-27
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture exact current world build
        run: |
          mkdir -p output
          python3 -m http.server 8123 --bind 127.0.0.1 >output/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1

          cat > capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 1920, height: 1080 },
            screen: { width: 1920, height: 1080 },
            deviceScaleFactor: 1,
            recordVideo: {
              dir: 'output',
              size: { width: 1920, height: 1080 }
            }
          });

          await context.addInitScript(() => {
            try { localStorage.setItem('histomap.v0.35.welcomeSeen', '1'); } catch {}
          });

          const page = await context.newPage();
          await page.goto('http://127.0.0.1:8123/world/', {
            waitUntil: 'domcontentloaded',
            timeout: 60000
          });
          await page.waitForTimeout(3500);

          // Force the exact requested starting state: default document model,
          // 100% browser zoom and the app's 1.0x zoom, positioned at the top.
          await page.evaluate(() => {
            document.documentElement.style.scrollBehavior = 'auto';
            if (document.body) document.body.style.scrollBehavior = 'auto';
            const slider = document.querySelector('#lensSlider');
            if (slider && slider.value !== '1') {
              slider.value = '1';
              slider.dispatchEvent(new Event('input', { bubbles: true }));
              slider.dispatchEvent(new Event('change', { bubbles: true }));
            }
            window.scrollTo(0, 0);
          });
          await page.waitForTimeout(700);

          const info = await page.evaluate(() => {
            const se = document.scrollingElement || document.documentElement;
            return {
              title: document.title,
              width: innerWidth,
              height: innerHeight,
              scrollHeight: se.scrollHeight,
              clientHeight: se.clientHeight,
              maxScroll: Math.max(0, se.scrollHeight - innerHeight),
              zoom: document.querySelector('#zoomReadout')?.textContent?.trim() || null,
              visible: document.querySelector('#visibleReadout')?.textContent?.trim() || null,
              heightMode: document.body.classList.contains('height-sparks') ? 'sparks' : 'other'
            };
          });

          fs.writeFileSync('output/capture-info.json', JSON.stringify(info, null, 2));
          console.log('Capture info:', JSON.stringify(info));
          await page.screenshot({ path: 'output/start.png' });

          // One uninterrupted, linear document scroll. At 80 CSS px/sec the
          // full 1x chart takes roughly a minute and a half: leisurely but moving.
          const speed = 80;
          const durationMs = Math.max(1000, info.maxScroll / speed * 1000);
          const scrollStartWall = Date.now();

          await page.evaluate(async ({ distance, durationMs }) => {
            const se = document.scrollingElement || document.documentElement;
            await new Promise(resolve => {
              const start = performance.now();
              const tick = now => {
                const p = Math.min(1, (now - start) / durationMs);
                window.scrollTo(0, distance * p);
                if (p < 1) requestAnimationFrame(tick);
                else resolve();
              };
              requestAnimationFrame(tick);
            });
            window.scrollTo(0, distance);
          }, { distance: info.maxScroll, durationMs });

          const actualScrollMs = Date.now() - scrollStartWall;
          await page.screenshot({ path: 'output/end.png' });
          fs.writeFileSync('output/timing.json', JSON.stringify({
            speedCssPxPerSec: speed,
            intendedScrollMs: durationMs,
            actualScrollMs
          }, null, 2));

          const video = page.video();
          await page.close();
          await context.close();
          if (video) await video.saveAs('output/histomap-scroll-1x.webm');
          await browser.close();
          EOF

          node capture.mjs

      - name: Upload capture
        uses: actions/upload-artifact@v4
        with:
          name: histomap-scroll-1x
          path: output/
          if-no-files-found: error
          retention-days: 7
