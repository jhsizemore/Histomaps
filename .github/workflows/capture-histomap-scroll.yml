name: Capture Histomap Scroll

on:
  push:
    branches:
      - video/histomap-scroll-2026-08-27
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bundle the deployed world build
        run: |
          tar -czf histomap-world-source.tar.gz world assets index.html _headers 2>/dev/null || tar -czf histomap-world-source.tar.gz world assets

      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: histomap-world-source
          path: histomap-world-source.tar.gz
          if-no-files-found: error
          retention-days: 7
