name: Star Wars poster shared-date grouping

# Retry after updating the media-count validation for grouped cards.
on:
  push:
    paths:
      - '.github/workflows/starwars-task2-poster-group.yml'

permissions:
  contents: write

jobs:
  apply-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply poster grouping refinement
        run: python StarWars/tools/task2_poster_group_patch.py
      - name: Validate renderer
        run: python -m py_compile StarWars/tools/poster/render.py
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Render poster
        run: python StarWars/tools/poster/render.py
      - name: Verify poster export
        run: |
          python - <<'PY'
          from PIL import Image
          p='StarWars/downloads/Star-Wars-Histomap-Poster.png'
          im=Image.open(p)
          assert im.size == (5200,18220), im.size
          print(im.size)
          PY
      - name: Commit refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add StarWars/tools/poster/render.py StarWars/downloads/Star-Wars-Histomap-Poster.png
          git commit -m "Group same-date titles in Star Wars poster lane"
          git push
