name: Restore verified homepage hero

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-hero.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Point hero at verified immutable asset
        shell: python
        run: |
          from pathlib import Path
          import re
          hero = 'https://raw.githubusercontent.com/jhsizemore/Histomaps/dcf0e3bc1db3c14a7da64ce0b50b4d57f8b6db50/assets/histomap-hero-hires.webp'

          p = Path('index.html')
          s = p.read_text()
          s = re.sub(r"/assets/histomap-hero-hires\.webp\?v=\d+", hero, s)
          s = re.sub(r"assets/editorial-pass\.css\?v=\d+", 'assets/editorial-pass.css?v=376', s)
          p.write_text(s)

          p = Path('assets/editorial-pass.css')
          s = p.read_text()
          s = re.sub(r"/assets/histomap-hero-hires\.webp\?v=\d+", hero, s)
          s = re.sub(r'/\* v0\.37\.\d+[^*]*\*/', '/* v0.37.6 restore verified immutable hero */', s, count=1)
          p.write_text(s)

      - name: Verify
        shell: bash
        run: |
          grep -q 'raw.githubusercontent.com/jhsizemore/Histomaps/dcf0e3bc1db3c14a7da64ce0b50b4d57f8b6db50/assets/histomap-hero-hires.webp' index.html
          grep -q 'raw.githubusercontent.com/jhsizemore/Histomaps/dcf0e3bc1db3c14a7da64ce0b50b4d57f8b6db50/assets/histomap-hero-hires.webp' assets/editorial-pass.css

      - name: Commit
        shell: bash
        run: |
          git config user.name 'histomaps-hero-restore'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html assets/editorial-pass.css
          git commit -m 'Restore verified Histomap homepage hero'
          git push
