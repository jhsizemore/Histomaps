name: Histomap v0.36.1 mobile QA

on:
  push:
    branches: [mobile-v0.36]
    paths:
      - 'world/**'
      - 'deploy/**'
      - 'histomap_v0_34_149_zoom_elastic_lifelines_titles_tooltips.html'
      - '.github/scripts/**'
      - '.github/workflows/mobile-v0.36-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4

      - name: Verify v0.36.1 interaction and refinement layers
        shell: bash
        run: |
          set -euo pipefail
          test -s world/mobile-v0.36.css
          test -s world/mobile-v0.36.js
          test -s world/mobile-v0.36.1-fixes.css
          test -s world/mobile-v0.36.1-fixes.js
          test -s world/manifest.webmanifest
          test -s world/sw.js
          test -s .github/scripts/mobile-v0.36.1-interaction-qa.mjs
          test -s .github/scripts/build-mobile-phone-check.py
          node --check world/mobile-v0.36.js
          node --check world/mobile-v0.36.1-fixes.js
          node --check .github/scripts/mobile-v0.36.1-interaction-qa.mjs
          python3 -m py_compile .github/scripts/build-mobile-phone-check.py
          python3 -m json.tool world/manifest.webmanifest >/dev/null
          grep -q 'mobile-v0.36.css?v=3' world/index.html
          grep -q 'mobile-v0.36.1-fixes.css?v=1' world/index.html
          grep -q 'mobile-v0.36.js?v=3' world/index.html
          grep -q 'mobile-v0.36.1-fixes.js?v=1' world/index.html
          grep -q 'HISTOMAP_MOBILE_V0361' world/mobile-v0.36.js
          grep -q 'HISTOMAP_MOBILE_V0361_REFINEMENT' world/mobile-v0.36.1-fixes.js
          grep -q 'yearAtViewportCenter' world/mobile-v0.36.1-fixes.js
          grep -q 'doubleTapEligible' world/mobile-v0.36.1-fixes.js
          grep -q 'startInertia' world/mobile-v0.36.js
          grep -q 'openSearch' world/mobile-v0.36.js
          grep -q 'openLayers' world/mobile-v0.36.js
          grep -q 'openJourneys' world/mobile-v0.36.js
          grep -q 'enhanceHitTargets' world/mobile-v0.36.js
          grep -q 'cullOffscreenDetail' world/mobile-v0.36.js
          grep -q 'hm-thumb-dock' world/mobile-v0.36.css
          grep -q 'hm-mobile-sheet.hm-sheet-full' world/mobile-v0.36.css
          grep -q 'stream-strip-height: 32px' world/mobile-v0.36.1-fixes.css

      - name: Serve development build
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/histomap-http.log 2>&1 &
          echo $! >/tmp/histomap-http.pid
          sleep 2
          curl --fail --silent http://127.0.0.1:8765/world/ >/dev/null
          curl --fail --silent http://127.0.0.1:8765/world/mobile-v0.36.1-fixes.js >/dev/null
          curl --fail --silent http://127.0.0.1:8765/world/mobile-v0.36.1-fixes.css >/dev/null

      - name: Resolve Chrome
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "path=$CHROME" >> "$GITHUB_OUTPUT"
          "$CHROME" --version

      - name: Smoke test phone portrait and landscape viewports
        shell: bash
        env:
          CHROME: ${{ steps.chrome.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/histomap-mobile-qa
          for CASE in 360x800 390x844 430x932 844x390; do
            W="${CASE%x*}"; H="${CASE#*x}"; OUT="/tmp/histomap-mobile-qa/${CASE}.html"
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size="$W,$H" --virtual-time-budget=17000 --dump-dom "http://127.0.0.1:8765/world/?hmqa=1" > "$OUT"
            grep -q '<svg id="histomap"' "$OUT"
            grep -Eq '<body[^>]*class="[^"]*histomap-mobile' "$OUT"
            grep -q 'data-hm-mobile-ready="true"' "$OUT"
            grep -q 'class="hm-thumb-dock"' "$OUT"
            grep -q 'class="hm-mobile-context"' "$OUT"
            grep -q 'data-hm-viewport-year=' "$OUT"
            grep -q 'data-hm-semantic-band=' "$OUT"
            echo "PASS v0.36.1 refined $CASE"
          done

      - name: Install Playwright interaction harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hm-playwright
          cd /tmp/hm-playwright
          npm init -y >/dev/null 2>&1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --silent playwright-core@1.54.2
          cp "$GITHUB_WORKSPACE/.github/scripts/mobile-v0.36.1-interaction-qa.mjs" ./interaction-qa.mjs

      - name: Run trusted touch interaction QA
        shell: bash
        env:
          CHROME: ${{ steps.chrome.outputs.path }}
        run: |
          set -euo pipefail
          cd /tmp/hm-playwright
          node interaction-qa.mjs | tee /tmp/histomap-mobile-qa/interaction-qa.txt
          grep -q 'ALL v0.36.1 INTERACTION QA PASSED' /tmp/histomap-mobile-qa/interaction-qa.txt

      - name: Smoke test desktop remains desktop
        shell: bash
        env:
          CHROME: ${{ steps.chrome.outputs.path }}
        run: |
          set -euo pipefail
          OUT=/tmp/histomap-mobile-qa/1280x800.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1280,800 --virtual-time-budget=15000 --dump-dom http://127.0.0.1:8765/world/ > "$OUT"
          grep -q '<svg id="histomap"' "$OUT"
          if grep -Eq '<body[^>]*class="[^"]*histomap-mobile' "$OUT"; then echo 'Desktop viewport incorrectly entered mobile mode.' >&2; exit 1; fi
          echo 'PASS 1280x800 desktop guard'

      - name: Capture refined mobile UI
        shell: bash
        env:
          CHROME: ${{ steps.chrome.outputs.path }}
        run: |
          set -euo pipefail
          for CASE in 360x800 390x844 430x932 844x390; do
            W="${CASE%x*}"; H="${CASE#*x}"
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size="$W,$H" --virtual-time-budget=17000 --screenshot="/tmp/histomap-mobile-qa/${CASE}.png" "http://127.0.0.1:8765/world/?hmqa=1"
          done

      - name: Capture welcome layout guard
        shell: bash
        env:
          CHROME: ${{ steps.chrome.outputs.path }}
        run: |
          set -euo pipefail
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=390,844 --virtual-time-budget=13000 --screenshot="/tmp/histomap-mobile-qa/390x844-welcome.png" http://127.0.0.1:8765/world/

      - name: Build standalone phone-check file
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/build-mobile-phone-check.py
          test -s /tmp/histomap-mobile-qa/Histomap-v0.36.1-phone-check.html

      - name: Smoke test standalone phone-check file
        shell: bash
        env:
          CHROME: ${{ steps.chrome.outputs.path }}
        run: |
          set -euo pipefail
          URI="file:///tmp/histomap-mobile-qa/Histomap-v0.36.1-phone-check.html"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --allow-file-access-from-files --hide-scrollbars --window-size=390,844 --virtual-time-budget=17000 --dump-dom "$URI" > /tmp/histomap-mobile-qa/phone-check-dom.html
          grep -q '<svg id="histomap"' /tmp/histomap-mobile-qa/phone-check-dom.html
          grep -Eq '<body[^>]*class="[^"]*histomap-mobile' /tmp/histomap-mobile-qa/phone-check-dom.html
          grep -q 'class="hm-thumb-dock"' /tmp/histomap-mobile-qa/phone-check-dom.html
          grep -q 'data-hm-viewport-year=' /tmp/histomap-mobile-qa/phone-check-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --allow-file-access-from-files --hide-scrollbars --window-size=390,844 --virtual-time-budget=17000 --screenshot=/tmp/histomap-mobile-qa/phone-check-standalone.png "$URI"
          echo 'PASS standalone phone-check file'

      - name: Upload mobile QA and phone build
        uses: actions/upload-artifact@v4
        with:
          name: histomap-v0.36.1-refined-phone-check
          path: /tmp/histomap-mobile-qa/
          if-no-files-found: error
          retention-days: 7
