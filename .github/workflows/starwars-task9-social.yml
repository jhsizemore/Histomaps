name: Star Wars launch metadata and social card

on:
  push:
    paths:
      - '.github/workflows/starwars-task9-social.yml'

permissions:
  contents: write

jobs:
  social:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image renderer
        run: python -m pip install --disable-pip-version-check pillow
      - name: Render social preview
        run: python StarWars/tools/social/render_social_card.py
      - name: Apply launch metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('StarWars/index.html')
          s=p.read_text()
          old='''  <meta name="description" content="Explore the rise and fall of galactic powers in an interactive Star Wars Histomap, with canon character lifelines, synchronized film and TV spans, and separate Legends histories.">\n  <link rel="canonical" href="https://histomaps.org/starwars/">\n  <title>Star Wars · Histomap</title>'''
          new='''  <meta name="description" content="Explore 500 BBY–35 ABY as galactic powers rise and fall, with films &amp; TV, character lifelines, and separate Legends timelines in one interactive Star Wars atlas.">\n  <meta name="robots" content="index,follow,max-image-preview:large">\n  <link rel="canonical" href="https://histomaps.org/starwars/">\n  <meta property="og:title" content="Star Wars Histomap — The History of the Galaxy, All at Once">\n  <meta property="og:description" content="Explore 500 BBY–35 ABY as galactic powers rise and fall, with films &amp; TV, character lifelines, and separate Legends timelines in one interactive atlas.">\n  <meta property="og:type" content="website">\n  <meta property="og:url" content="https://histomaps.org/starwars/">\n  <meta property="og:site_name" content="Histomaps.org">\n  <meta property="og:locale" content="en_US">\n  <meta property="og:image" content="https://histomaps.org/starwars/assets/star-wars-histomap-social-card.png?v=20260907">\n  <meta property="og:image:secure_url" content="https://histomaps.org/starwars/assets/star-wars-histomap-social-card.png?v=20260907">\n  <meta property="og:image:type" content="image/png">\n  <meta property="og:image:width" content="1200">\n  <meta property="og:image:height" content="630">\n  <meta property="og:image:alt" content="Star Wars Histomap preview showing the Star Wars title, flowing galactic political streams, and histomaps.org/starwars.">\n  <meta name="twitter:card" content="summary_large_image">\n  <meta name="twitter:title" content="Star Wars Histomap — The History of the Galaxy, All at Once">\n  <meta name="twitter:description" content="Explore galactic powers, films &amp; TV, character lifelines, and separate Legends histories on one interactive timeline.">\n  <meta name="twitter:image" content="https://histomaps.org/starwars/assets/star-wars-histomap-social-card.png?v=20260907">\n  <meta name="twitter:image:alt" content="Star Wars Histomap preview showing the Star Wars title, flowing galactic political streams, and histomaps.org/starwars.">\n  <title>Star Wars Histomap — The History of the Galaxy, All at Once</title>'''
          if old not in s:
              raise SystemExit('metadata replacement target not found')
          p.write_text(s.replace(old,new,1))

          r=Path('StarWars/README.md')
          t=r.read_text()
          note='''\n## Sharing metadata\n\nThe canonical Star Wars page includes OpenGraph and summary-large-image metadata for `https://histomaps.org/starwars/`. Its dedicated 1,200 × 630 preview is `assets/star-wars-histomap-social-card.png`, generated by `tools/social/render_social_card.py` from the same starfield, title artwork, typography, and full poster used by the atlas.\n'''
          if '## Sharing metadata' not in t:
              r.write_text(t.rstrip()+note+'\n')
          PY
      - name: Validate launch metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          h=Path('StarWars/index.html').read_text()
          required=[
            'Star Wars Histomap — The History of the Galaxy, All at Once',
            'property="og:type" content="website"',
            'property="og:url" content="https://histomaps.org/starwars/"',
            'property="og:image" content="https://histomaps.org/starwars/assets/star-wars-histomap-social-card.png?v=20260907"',
            'property="og:image:width" content="1200"',
            'property="og:image:height" content="630"',
            'name="twitter:card" content="summary_large_image"',
            'name="twitter:image" content="https://histomaps.org/starwars/assets/star-wars-histomap-social-card.png?v=20260907"',
            'name="robots" content="index,follow,max-image-preview:large"'
          ]
          for x in required: assert x in h,x
          im=Image.open('StarWars/assets/star-wars-histomap-social-card.png')
          assert im.size==(1200,630),im.size
          print('social card',im.size,im.mode)
          PY
          node --check StarWars/app.js
          node StarWars/tools/poster/audit-data-sync.js
      - name: Commit launch metadata and preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add StarWars/index.html StarWars/README.md StarWars/assets/star-wars-histomap-social-card.png
          git commit -m "Add Star Wars launch metadata and social preview"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: starwars-task9-social-preview
          path: StarWars/assets/star-wars-histomap-social-card.png
          retention-days: 1
