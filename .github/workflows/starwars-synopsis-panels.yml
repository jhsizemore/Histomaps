name: Star Wars synopsis panels

on:
  push:
    paths:
      - '.github/workflows/starwars-synopsis-panels.yml'

permissions:
  contents: write

jobs:
  synopsis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply synopsis panel patch
        run: python StarWars/tools/synopsis_panel_patch.py
      - name: Validate source
        run: |
          node --check StarWars/app.js
          node --check StarWars/synopses.js
          grep -Fq 'synopses.js?v=synopsis-20260907' StarWars/index.html
          grep -Fq 'record-synopsis-20260907' StarWars/styles.css
          grep -Fq 'function appendSynopsis' StarWars/app.js
          git diff --check
      - name: Install Playwright
        run: python -m pip install --disable-pip-version-check playwright
      - name: Visual, behavior, and Wookieepedia API QA
        run: |
          python -m http.server 8000 --directory . >/tmp/starwars-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python StarWars/tools/synopsis_panel_qa.py
      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starwars-synopsis-panels-qa
          path: |
            /tmp/synopsis-qa/*.png
            /tmp/synopsis-qa/wookieepedia-api-probe.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Commit synopsis panel integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add StarWars/app.js StarWars/styles.css StarWars/index.html
          git commit -m 'Add concise synopses to Star Wars data panels'
          git pull --rebase origin main
          git push
