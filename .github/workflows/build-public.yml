name: Build public Histomaps

on:
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - 'assets/**'
      - '.github/workflows/build-public.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate public index.html
        shell: bash
        run: |
          set -euo pipefail
          cp histomap_v0_34_149_zoom_elastic_lifelines_titles_tooltips.html index.html
          cat deploy/v0.35.3.patch.part01 \
              deploy/v0.35.3.patch.part02 \
              deploy/v0.35.3.patch.part03 \
              deploy/v0.35.3.patch.part04 > /tmp/v0.35.3.patch
          patch -p0 < /tmp/v0.35.3.patch
          echo '5877e2f06bf617b160e6b2fbb5f5acc9ed60c633b4417e87db3ae20d9a171ac2  index.html' | sha256sum --check -

      - name: Commit generated public build
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'index.html is already current.'
            exit 0
          fi
          git config user.name 'histomaps-build'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Deploy Histomaps v0.35.3 public preview'
          git push
