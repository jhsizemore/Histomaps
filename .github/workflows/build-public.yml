name: Build protected Histomaps v0.36.2 mobile production

on:
  push:
    branches: [mobile-v0.36-production-build]
    paths:
      - '.github/workflows/build-public.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out production-build branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Assemble frozen v0.35.3 core
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('histomap_v0_34_149_zoom_elastic_lifelines_titles_tooltips.html', 'utf8');
          const patch = [1,2,3,4].map(n => fs.readFileSync(`deploy/v0.35.3.patch.part0${n}`, 'utf8')).join('');

          function applyUnifiedPatch(source, patch) {
            const sourceHadFinalNewline = source.endsWith('\n');
            let lines = source.replace(/\r\n/g,'\n').split('\n');
            if (sourceHadFinalNewline && lines[lines.length - 1] === '') lines.pop();
            const p = patch.replace(/\r\n/g,'\n').split('\n');
            let offset = 0;
            for (let i = 0; i < p.length; i++) {
              const m = p[i].match(/^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@/);
              if (!m) continue;
              const oldStart = Number(m[1]);
              const oldCount = m[2] === undefined ? 1 : Number(m[2]);
              const replacement = [], expected = [];
              i++;
              for (; i < p.length && !p[i].startsWith('@@ '); i++) {
                const row = p[i];
                if (row.startsWith('--- ') || row.startsWith('+++ ') || row === '\\ No newline at end of file') continue;
                const tag = row[0], text = row.slice(1);
                if (tag === ' ') { expected.push(text); replacement.push(text); }
                else if (tag === '-') expected.push(text);
                else if (tag === '+') replacement.push(text);
              }
              i--;
              const at = oldStart - 1 + offset;
              const actual = lines.slice(at, at + oldCount);
              if (actual.length !== expected.length || actual.some((v,j) => v !== expected[j])) throw new Error(`Patch context mismatch near source line ${oldStart}`);
              lines.splice(at, oldCount, ...replacement);
              offset += replacement.length - oldCount;
            }
            return lines.join('\n') + (sourceHadFinalNewline ? '\n' : '');
          }

          fs.writeFileSync('/tmp/index.html', applyUnifiedPatch(source, patch), 'utf8');
          NODE
          test -s /tmp/index.html

      - name: Inject mobile v0.36.2 layer and production metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/index.html')
          html = p.read_text(encoding='utf-8')
          html = html.replace('src="assets/histomap-logo.svg"', 'src="../assets/histomap-logo.svg?v=366"')
          html = html.replace('href="assets/favicon.svg"', 'href="../assets/favicon.svg?v=366"')

          css = '\n'.join([
              Path('world/mobile-v0.36.css').read_text(encoding='utf-8'),
              Path('world/mobile-v0.36.1-fixes.css').read_text(encoding='utf-8')
          ])
          js = '\n'.join([
              Path('world/mobile-v0.36.js').read_text(encoding='utf-8'),
              Path('world/mobile-v0.36.1-fixes.js').read_text(encoding='utf-8'),
              Path('world/mobile-v0.36.2-pinch.js').read_text(encoding='utf-8')
          ])
          mobile = ''.join([
              '<meta name="theme-color" content="#eee5d6">',
              '<meta name="apple-mobile-web-app-capable" content="yes">',
              '<meta name="apple-mobile-web-app-status-bar-style" content="default">',
              '<link rel="manifest" href="./manifest.webmanifest">',
              '<style id="histomap-mobile-v0362">', css, '</style>',
              '<script id="histomap-mobile-v0362-js">', js, '</script>',
              '<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}</script>'
          ])

          additions = []
          if 'rel="canonical"' not in html and "rel='canonical'" not in html:
              additions.append('<link rel="canonical" href="https://histomaps.org/world/">')
          if 'name="description"' not in html and "name='description'" not in html:
              additions.append('<meta name="description" content="Explore four thousand years of world history as flowing streams, events and human lifelines.">')
          if 'name="author"' not in html and "name='author'" not in html:
              additions.append('<meta name="author" content="J. Hunter Sizemore">')
          if 'name="copyright"' not in html and "name='copyright'" not in html:
              additions.append('<meta name="copyright" content="© 2026 J. Hunter Sizemore">')
          additions.append(mobile)
          html = html.replace('</head>', ''.join(additions) + '</head>', 1)
          p.write_text(html, encoding='utf-8')
          PY

      - name: Minify protected HTML CSS and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p world
          npx --yes html-minifier-terser@7.2.0 /tmp/index.html \
            --output world/index.html \
            --collapse-whitespace \
            --conservative-collapse \
            --remove-comments \
            --remove-redundant-attributes \
            --remove-script-type-attributes \
            --remove-style-link-type-attributes \
            --use-short-doctype \
            --minify-css true \
            --minify-js true
          tmp="$(mktemp)"
          printf '%s\n' '<!-- Histomaps World v0.36.2 mobile production | © 2026 J. Hunter Sizemore | Based on John B. Sparks, The Histomap (1931). -->' > "$tmp"
          cat world/index.html >> "$tmp"
          mv "$tmp" world/index.html

      - name: Write production service worker
        shell: bash
        run: |
          cat > world/sw.js <<'EOF'
          const CACHE='histomap-world-v0.36.2-production';
          const SHELL=['./','./manifest.webmanifest','../assets/favicon.svg','../assets/histomap-logo.svg'];
          self.addEventListener('install',e=>e.waitUntil((async()=>{const c=await caches.open(CACHE);await Promise.allSettled(SHELL.map(u=>c.add(u)));await self.skipWaiting()})()));
          self.addEventListener('activate',e=>e.waitUntil((async()=>{const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('histomap-world-')&&k!==CACHE).map(k=>caches.delete(k)));await self.clients.claim()})()));
          self.addEventListener('fetch',e=>{const r=e.request;if(r.method!=='GET')return;const u=new URL(r.url);if(u.origin!==self.location.origin)return;if(r.mode==='navigate'){e.respondWith((async()=>{try{const x=await fetch(r);const c=await caches.open(CACHE);c.put(r,x.clone()).catch(()=>{});return x}catch(_){return(await caches.match(r))||(await caches.match('./'))}})());return}e.respondWith((async()=>{const hit=await caches.match(r);const net=fetch(r).then(async x=>{if(x&&x.ok){const c=await caches.open(CACHE);c.put(r,x.clone()).catch(()=>{})}return x}).catch(()=>null);if(hit){e.waitUntil(net);return hit}return(await net)||Response.error()})())});
          EOF

      - name: Validate protected mobile production artifact
        shell: bash
        run: |
          set -euo pipefail
          source_bytes="$(wc -c < /tmp/index.html)"
          production_bytes="$(wc -c < world/index.html)"
          echo "source_bytes=$source_bytes production_bytes=$production_bytes"
          test "$production_bytes" -lt "$source_bytes"
          python3 - <<'PY'
          from pathlib import Path
          html = Path('world/index.html').read_text(encoding='utf-8')
          lower = html.lower()
          checks = {
              'doctype': '<!doctype html' in lower,
              'logo': '../assets/histomap-logo.svg?v=366' in html,
              'Sparks credit': 'sparks' in lower,
              'lifelines': 'lifeline' in lower,
              'canonical metadata': 'canonical' in lower,
              'mobile runtime': 'histomap-mobile' in html,
              'manifest': 'manifest.webmanifest' in html,
          }
          missing = [name for name, ok in checks.items() if not ok]
          if missing:
              raise SystemExit('Missing required production markers: ' + ', '.join(missing))
          banned = ['v0.35.3.patch.part', 'histomap_v0_34_149_zoom_elastic_lifelines_titles_tooltips.html']
          exposed = [token for token in banned if token in html]
          if exposed:
              raise SystemExit('Readable/development references remain: ' + ', '.join(exposed))
          print('Protected mobile production markers validated')
          PY
          printf 'version=v0.36.2-mobile-production\nsource_sha256=%s\nproduction_sha256=%s\nsource_bytes=%s\nproduction_bytes=%s\n' \
            "$(sha256sum /tmp/index.html | cut -d' ' -f1)" \
            "$(sha256sum world/index.html | cut -d' ' -f1)" \
            "$source_bytes" "$production_bytes" > world/BUILD

      - name: Browser smoke test protected build
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$chrome" ]; then echo 'Chrome not present; static validation passed.'; exit 0; fi
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/histomaps-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          "$chrome" --headless --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=17000 --dump-dom http://127.0.0.1:8765/world/ > /tmp/world-mobile-dom.html
          test -s /tmp/world-mobile-dom.html
          grep -qi 'svg' /tmp/world-mobile-dom.html
          grep -q 'histomap-mobile' /tmp/world-mobile-dom.html
          "$chrome" --headless --no-sandbox --disable-gpu --window-size=1440,1000 --virtual-time-budget=15000 --dump-dom http://127.0.0.1:8765/world/ > /tmp/world-desktop-dom.html
          test -s /tmp/world-desktop-dom.html
          grep -qi 'svg' /tmp/world-desktop-dom.html

      - name: Add conservative production security headers
        shell: bash
        run: |
          cat > _headers <<'EOF'
          /*
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: camera=(), microphone=(), geolocation=()
          EOF

      - name: Remove public development scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -f histomap_v0_34_149_zoom_elastic_lifelines_titles_tooltips.html
          rm -rf deploy
          rm -f .github/hero-debug.txt
          rm -rf .github/hero-parts
          rm -f .github/workflows/build-public.yml
          rm -f .github/workflows/mobile-v0.36-qa.yml
          rm -f .github/scripts/build-mobile-phone-check.py
          rm -f .github/scripts/mobile-v0.36.1-interaction-qa.mjs
          rm -f world/mobile-v0.36.css world/mobile-v0.36.js
          rm -f world/mobile-v0.36.1-fixes.css world/mobile-v0.36.1-fixes.js world/mobile-v0.36.2-pinch.js

      - name: Mark repository as protected mobile production mirror
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          marker = '## World Histomap production'
          block = '''## World Histomap production\n\n`/world/` is the protected v0.36.2 mobile production build. The readable development master, deployment patches, mobile source layers, and QA scaffolding are intentionally not kept on this public production branch. HTML, CSS and JavaScript are minified for deployment.\n'''
          if marker in text:
              text = text[:text.index(marker)].rstrip() + '\n\n' + block
          else:
              text += '\n\n' + block
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit protected mobile production build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'histomaps-build'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy protected Histomaps v0.36.2 mobile production build'
          git push
