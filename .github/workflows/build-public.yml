name: Freeze protected World Histomap production build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-public.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Assemble frozen v0.35.3 source with the current browser patcher
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('histomap_v0_34_149_zoom_elastic_lifelines_titles_tooltips.html', 'utf8');
          const patch = [1,2,3,4].map(n => fs.readFileSync(`deploy/v0.35.3.patch.part0${n}`, 'utf8')).join('');

          function applyUnifiedPatch(source, patch) {
            const sourceHadFinalNewline = source.endsWith('\n');
            let lines = source.replace(/\r\n/g,'\n').split('\n');
            if (sourceHadFinalNewline && lines[lines.length - 1] === '') lines.pop();
            const p = patch.replace(/\r\n/g,'\n').split('\n');
            let offset = 0;
            for (let i = 0; i < p.length; i++) {
              const m = p[i].match(/^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@/);
              if (!m) continue;
              const oldStart = Number(m[1]);
              const oldCount = m[2] === undefined ? 1 : Number(m[2]);
              const replacement = [];
              const expected = [];
              i++;
              for (; i < p.length && !p[i].startsWith('@@ '); i++) {
                const row = p[i];
                if (row.startsWith('--- ') || row.startsWith('+++ ') || row === '\\ No newline at end of file') continue;
                const tag = row[0];
                const body = row.slice(1);
                if (tag === ' ') { expected.push(body); replacement.push(body); }
                else if (tag === '-') expected.push(body);
                else if (tag === '+') replacement.push(body);
              }
              i--;
              const at = oldStart - 1 + offset;
              const actual = lines.slice(at, at + oldCount);
              if (actual.length !== expected.length || actual.some((v,j) => v !== expected[j])) throw new Error(`Patch context mismatch near source line ${oldStart}`);
              lines.splice(at, oldCount, ...replacement);
              offset += replacement.length - oldCount;
            }
            return lines.join('\n') + (sourceHadFinalNewline ? '\n' : '');
          }

          fs.writeFileSync('/tmp/index.html', applyUnifiedPatch(source, patch), 'utf8');
          NODE
          echo "assembled_sha256=$(sha256sum /tmp/index.html | cut -d' ' -f1)"
          test -s /tmp/index.html

      - name: Prepare production paths and metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/index.html')
          html = p.read_text(encoding='utf-8')
          html = html.replace('src="assets/histomap-logo.svg"', 'src="../assets/histomap-logo.svg?v=366"')
          html = html.replace('href="assets/favicon.svg"', 'href="../assets/favicon.svg?v=366"')
          additions = []
          if 'rel="canonical"' not in html and "rel='canonical'" not in html:
              additions.append('<link rel="canonical" href="https://histomaps.org/world/">')
          if 'name="description"' not in html and "name='description'" not in html:
              additions.append('<meta name="description" content="Explore four thousand years of world history as flowing streams, events and human lifelines.">')
          if 'name="author"' not in html and "name='author'" not in html:
              additions.append('<meta name="author" content="J. Hunter Sizemore">')
          if 'name="copyright"' not in html and "name='copyright'" not in html:
              additions.append('<meta name="copyright" content="© 2026 J. Hunter Sizemore">')
          if additions:
              html = html.replace('</head>', ''.join(additions) + '</head>', 1)
          p.write_text(html, encoding='utf-8')
          PY

      - name: Minify HTML, CSS and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p world
          npx --yes html-minifier-terser@7.2.0 /tmp/index.html \
            --output world/index.html \
            --collapse-whitespace \
            --conservative-collapse \
            --remove-comments \
            --remove-redundant-attributes \
            --remove-script-type-attributes \
            --remove-style-link-type-attributes \
            --use-short-doctype \
            --minify-css true \
            --minify-js true
          tmp="$(mktemp)"
          printf '%s\n' '<!-- Histomaps World v0.35.3 production build | © 2026 J. Hunter Sizemore | Based on John B. Sparks, The Histomap (1931). -->' > "$tmp"
          cat world/index.html >> "$tmp"
          mv "$tmp" world/index.html

      - name: Validate production artifact
        shell: bash
        run: |
          set -euo pipefail
          source_bytes="$(wc -c < /tmp/index.html)"
          production_bytes="$(wc -c < world/index.html)"
          test "$production_bytes" -lt "$source_bytes"
          grep -qi '<!doctype html' world/index.html
          grep -q '../assets/histomap-logo.svg?v=366' world/index.html
          grep -qi 'Sparks' world/index.html
          grep -qi 'lifeline' world/index.html
          grep -qi 'canonical' world/index.html
          if grep -q 'v0.35.3.patch.part' world/index.html; then
            echo 'Production file still references deployment patches.' >&2
            exit 1
          fi
          if grep -q 'histomap_v0_34_149_zoom_elastic_lifelines_titles_tooltips.html' world/index.html; then
            echo 'Production file still references readable source.' >&2
            exit 1
          fi
          printf 'version=v0.35.3-production\nsource_sha256=%s\nproduction_sha256=%s\nsource_bytes=%s\nproduction_bytes=%s\n' \
            "$(sha256sum /tmp/index.html | cut -d' ' -f1)" \
            "$(sha256sum world/index.html | cut -d' ' -f1)" \
            "$source_bytes" "$production_bytes" > world/BUILD

      - name: Browser smoke test when Chrome is available
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$chrome" ]; then
            echo 'Chrome not present on runner; static validation already passed.'
            exit 0
          fi
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/histomaps-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          "$chrome" --headless --no-sandbox --disable-gpu --virtual-time-budget=2500 --dump-dom http://127.0.0.1:8765/world/ > /tmp/world-dom.html
          test -s /tmp/world-dom.html
          grep -qi 'svg' /tmp/world-dom.html

      - name: Add conservative production security headers
        shell: bash
        run: |
          cat > _headers <<'EOF'
          /*
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: camera=(), microphone=(), geolocation=()
          EOF

      - name: Remove public development scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -f histomap_v0_34_149_zoom_elastic_lifelines_titles_tooltips.html
          rm -rf deploy
          rm -f .github/hero-debug.txt
          rm -rf .github/hero-parts
          rm -f .github/workflows/build-public.yml

      - name: Mark repository as production-only mirror
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          old = '''## World Histomap development\n\nThe current World Histomap public preview is assembled from the existing v0.34.149 base plus the v0.35.3 deployment patches. This is a temporary bridge while the readable development build and the final production build are kept distinct.\n\nThe intended next production step is to replace the bootstrap/patch assembly with a static optimized public build once the v0.35 public-facing feature set is frozen.\n'''
          new = '''## World Histomap production\n\n`/world/` is a frozen, static production build. The readable development master and deployment patch scaffolding are intentionally not kept on the current public branch. HTML, CSS and JavaScript are minified for deployment; development should continue from the readable private master rather than from the production artifact.\n'''
          if old in text:
              text = text.replace(old, new)
          else:
              text += '\n\n' + new
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit frozen production build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'histomaps-build'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy protected Histomaps v0.35.3 production build'
          git push
