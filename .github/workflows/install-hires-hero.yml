name: Install high-resolution homepage hero

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-hires-hero.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assemble and verify exact hero asset
        shell: bash
        run: |
          set -euo pipefail
          cat .github/hero-parts/part*.txt | tr -d '\r\n' | base64 -d > assets/histomap-hero-hires.webp
          test "$(stat -c%s assets/histomap-hero-hires.webp)" -eq 124012
          echo '588344d29f13f21bb545bf96f888ed87a77ff6e22eccfa047d04f5e57a52e325  assets/histomap-hero-hires.webp' | sha256sum --check -

      - name: Use high-resolution hero on homepage
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('index.html')
          s = index.read_text()
          s = re.sub(r'assets/editorial-pass\.css\?v=\d+', 'assets/editorial-pass.css?v=373', s)
          s = re.sub(
              r'/assets/(?:hero-world-histomap|histomap-hero-drive|histomap-hero-hires)\.(?:jpg|webp)\?v=\d+',
              '/assets/histomap-hero-hires.webp?v=373',
              s,
          )
          s = re.sub(r'\s+onerror="[^"]*"', '', s)
          index.write_text(s)

          css = Path('assets/editorial-pass.css')
          c = css.read_text()
          c = re.sub(
              r'/assets/(?:hero-world-histomap|histomap-hero-drive|histomap-hero-hires)\.(?:jpg|webp)\?v=\d+',
              '/assets/histomap-hero-hires.webp?v=373',
              c,
          )
          c = re.sub(
              r'/\* v0\.37\.\d+[^*]*\*/',
              '/* v0.37.3 high-resolution homepage hero */',
              c,
              count=1,
          )
          css.write_text(c)

      - name: Commit high-resolution hero
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'histomaps-asset-install'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/histomap-hero-hires.webp assets/editorial-pass.css index.html
          git commit -m 'Install high-resolution Histomap homepage hero'
          git push
