name: Star Wars landing experience

on:
  push:
    paths:
      - '.github/workflows/starwars-task5-landing.yml'

permissions:
  contents: write

jobs:
  apply-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix landing style serialization
        run: python StarWars/tools/task5_style_fix.py
      - name: Structural checks
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('StarWars/index.html').read_text()
          assert t.count('id="launch-intro"') == 1
          assert t.count('id="launch-explore"') == 1
          assert '\\n    .launch-intro' not in t
          assert '.launch-intro{position:absolute' in t
          assert 'The history of the Star Wars galaxy, all at once.' in t
          print('landing markup + CSS serialization OK')
          PY
      - name: Install Playwright Python package
        run: python -m pip install --disable-pip-version-check playwright
      - name: Capture first-load and explored states
        run: |
          mkdir -p qa
          python -m http.server 8000 --directory StarWars >/tmp/histomap-http.log 2>&1 &
          python - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright

          async def capture(browser,name,width,height):
              page=await browser.new_page(viewport={'width':width,'height':height},device_scale_factor=1)
              await page.goto('http://127.0.0.1:8000/',wait_until='networkidle')
              intro=page.locator('#launch-intro')
              card=page.locator('.launch-card')
              assert await intro.is_visible()
              box=await card.bounding_box()
              assert box and box['width'] < width*.96, (name,box)
              await page.screenshot(path=f'qa/{name}-intro.png')
              await page.locator('#launch-explore').click()
              await page.wait_for_timeout(100)
              assert not await intro.is_visible()
              await page.screenshot(path=f'qa/{name}-map.png')
              await page.close()

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(executable_path='/usr/bin/google-chrome')
                  await capture(browser,'desktop',1440,900)
                  await capture(browser,'mobile',390,844)
                  await capture(browser,'landscape',844,390)
                  await browser.close()
          asyncio.run(main())
          PY
      - name: Commit corrected landing experience
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add StarWars/index.html
          git commit -m "Fix Star Wars landing presentation"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: starwars-task5-landing-qa-final
          path: qa
          retention-days: 1
