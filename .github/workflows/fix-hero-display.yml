name: Fix Histomap homepage hero display

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-hero-display.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove low-resolution hero fallback
        shell: python
        run: |
          from pathlib import Path

          asset = '/assets/histomap-hero-hires.webp?v=374'

          css = Path('assets/editorial-pass.css')
          c = css.read_text()
          c = c.replace('/* v0.37.0 opening-section refinement with resilient hero fallbacks */',
                        '/* v0.37.4 homepage hero uses one verified high-resolution local asset */')
          c = c.replace("url('/assets/hero-world-histomap.jpg?v=370')", f"url('{asset}')")
          css.write_text(c)

          index = Path('index.html')
          s = index.read_text()
          s = s.replace('assets/editorial-pass.css?v=370', 'assets/editorial-pass.css?v=374')
          s = s.replace('/assets/histomap-hero-hires.webp?v=371', asset)
          index.write_text(s)

      - name: Verify homepage has no low-resolution hero path
        shell: bash
        run: |
          set -euo pipefail
          grep -q '/assets/histomap-hero-hires.webp?v=374' index.html
          grep -q '/assets/histomap-hero-hires.webp?v=374' assets/editorial-pass.css
          if grep -q 'hero-world-histomap.jpg' assets/editorial-pass.css; then
            echo 'Old low-resolution fallback still present' >&2
            exit 1
          fi

      - name: Commit display fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'histomaps-hero-fix'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html assets/editorial-pass.css
          git commit -m 'Serve homepage hero only from high-resolution local asset'
          git push
