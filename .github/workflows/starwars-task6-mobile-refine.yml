name: Star Wars mobile refinement

on:
  push:
    paths:
      - '.github/workflows/starwars-task6-mobile-refine.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply mobile refinement
        run: python StarWars/tools/task6_mobile_refine.py
      - name: Validate source
        run: node --check StarWars/app.js
      - name: Install browser QA package
        run: python -m pip install --disable-pip-version-check playwright
      - name: Capture narrow-phone film and lifeline states
        run: |
          mkdir -p qa
          python -m http.server 8000 --directory StarWars >/tmp/histomap-http.log 2>&1 &
          python - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(executable_path='/usr/bin/google-chrome')
                  page=await browser.new_page(viewport={'width':360,'height':800},device_scale_factor=1)
                  await page.goto('http://127.0.0.1:8000/',wait_until='networkidle')
                  if await page.locator('#launch-intro').is_visible():
                      await page.locator('#launch-explore').click(); await page.wait_for_timeout(80)
                  await page.locator('[data-layer="screen"]').click(); await page.wait_for_timeout(80)
                  await page.screenshot(path='qa/phone360-films-final.png')
                  key=await page.locator('#screen-map .screen-meta').nth(0).text_content()
                  await page.locator('[data-layer="life"]').click(); await page.wait_for_timeout(100)
                  await page.screenshot(path='qa/phone360-lifelines-final.png')
                  footer=await page.locator('#layer-caption').text_content()
                  print('screen key:',key)
                  print('lifeline footer:',footer)
                  await browser.close()
          asyncio.run(main())
          PY
      - name: Commit refinements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add StarWars/index.html StarWars/app.js
          git commit -m "Refine Star Wars mobile companion legends"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: starwars-task6-mobile-refine-qa
          path: qa
          retention-days: 1
