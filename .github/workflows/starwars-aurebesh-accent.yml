name: Star Wars Aurebesh accent QA

on:
  push:
    paths:
      - '.github/workflows/starwars-aurebesh-accent.yml'

permissions:
  contents: write

jobs:
  accent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install FT Aurebesh locally
        run: |
          git clone --depth 1 https://github.com/ChewKeanHo/visuals-fonts-ft-aurebesh.git /tmp/ft-aurebesh
          python -m pip install --disable-pip-version-check fonttools brotli
          python - <<'PY'
          from pathlib import Path
          from fontTools.ttLib import TTFont
          files=sorted([*Path('/tmp/ft-aurebesh').rglob('*.otf'),*Path('/tmp/ft-aurebesh').rglob('*.ttf')])
          candidates=[]
          for p in files:
              try:
                  f=TTFont(p)
                  family=f['name'].getDebugName(1) or ''
                  sub=f['name'].getDebugName(2) or ''
                  license_text=' '.join(filter(None,[f['name'].getDebugName(13),f['name'].getDebugName(14)]))
                  if 'Aurebesh' in family:
                      candidates.append((0 if sub.lower() in ('regular','roman','normal') else 1,p,family,sub,license_text))
              except Exception:
                  pass
          assert candidates, f'No FT Aurebesh font found among {len(files)} font files'
          candidates.sort(key=lambda x:(x[0],len(str(x[1]))))
          _,src,family,sub,license_text=candidates[0]
          print('Using',src,'family=',family,'subfamily=',sub,'license=',license_text[:240])
          assert 'Open Font License' in license_text or 'OFL' in license_text, license_text
          f=TTFont(src)
          f.flavor='woff2'
          out=Path('StarWars/fonts/ft-aurebesh.woff2')
          f.save(out)
          print('Wrote',out,out.stat().st_size)
          PY
          cp StarWars/fonts/newscycle-OFL.txt StarWars/fonts/ft-aurebesh-OFL.txt
      - name: Apply Aurebesh accent correction
        run: python StarWars/tools/aurebesh_accent_patch.py
      - name: Validate source
        run: |
          node --check StarWars/app.js
          grep -Fq "font-family:'FT Aurebesh'" StarWars/styles.css
          grep -Fq 'aurebesh-archive-mark' StarWars/index.html
          ! grep -Fq 'Imperial+Script' StarWars/index.html
          ! grep -Fq 'imperial-active-mark' StarWars/app.js
          test -s StarWars/fonts/ft-aurebesh.woff2
          test -s StarWars/fonts/ft-aurebesh-OFL.txt
          git diff --check
      - name: Install Playwright
        run: python -m pip install --disable-pip-version-check playwright
      - name: Visual and font QA
        run: |
          python -m http.server 8000 --directory . >/tmp/starwars-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python StarWars/tools/aurebesh_accent_qa.py
      - name: Upload QA
        uses: actions/upload-artifact@v4
        with:
          name: starwars-aurebesh-accent-qa
          path: /tmp/aurebesh-qa/*.png
          retention-days: 3
      - name: Commit production correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add StarWars/index.html StarWars/app.js StarWars/styles.css StarWars/fonts/credits.txt StarWars/fonts/ft-aurebesh.woff2 StarWars/fonts/ft-aurebesh-OFL.txt
          git commit -m 'Replace cursive accents with Aurebesh interface glyphs'
          git pull --rebase origin main
          git push
