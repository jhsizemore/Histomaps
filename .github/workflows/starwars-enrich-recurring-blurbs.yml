name: Star Wars recurring synopsis enrichment

on:
  push:
    paths:
      - '.github/workflows/starwars-enrich-recurring-blurbs.yml'

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply enriched blurbs
        run: python StarWars/tools/enrich_recurring_blurbs.py
      - name: Validate enriched data
        run: |
          node --check StarWars/recurring-lifelines.js
          node - <<'JS'
          const fs=require('fs'),vm=require('vm');global.window={};
          for(const f of ['data.js','expanded-data.js','lifelines.js','recurring-lifelines.js','synopses.js']) vm.runInThisContext(fs.readFileSync('StarWars/'+f,'utf8'),{filename:f});
          const D=window.HISTOMAP;
          if(D.lifelines.length!==94||D.recurringLifelineCount!==78) throw new Error('lifeline count drift');
          const ids=['r2d2','c3po','palpatine','maul','mace','dooku','boba','bail','tarkin','mon','saw','grievous','grandinq','ackbar','wedge','bb8','bokatan','rex','hera','chopper','fennec','cadbane','din','zeb','huyang','thrawn','yularen','jabba','hux','marrok'];
          for(const id of ids){
            const p=D.lifelines.find(v=>v.id===id);
            if(!p) throw new Error('missing '+id);
            const text=p.synopsis||'';
            const sentences=(text.match(/[.!?](?:\s|$)/g)||[]).length;
            if(sentences<2||sentences>3) throw new Error(id+' synopsis sentence count '+sentences+': '+text);
            if(text.length<150) throw new Error(id+' synopsis too thin: '+text.length);
          }
          console.log('Validated',ids.length,'enriched recurring-character synopses.');
          JS
          node StarWars/tools/poster/audit-data-sync.js
          git diff --check
      - name: Commit enriched recurring blurbs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add StarWars/recurring-lifelines.js
          git commit -m 'Enrich major recurring Star Wars character synopses'
          git pull --rebase origin main
          git push
