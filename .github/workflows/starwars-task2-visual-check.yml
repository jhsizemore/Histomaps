name: Star Wars Films and TV visual QA

# Re-run after grouping same-date poster titles.
on:
  push:
    paths:
      - '.github/workflows/starwars-task2-visual-check.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install visual QA dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow playwright
          python -m playwright install --with-deps chromium
      - name: Make poster QA crops
        run: |
          mkdir -p qa
          python - <<'PY'
          from PIL import Image
          im=Image.open('StarWars/downloads/Star-Wars-Histomap-Poster.png').convert('RGB')
          full=im.resize((1300,4555),Image.Resampling.LANCZOS)
          full.save('qa/poster-full.jpg',quality=88)
          # Films & TV is the fourth major column in the canon panel.
          crop=im.crop((3180,900,4260,10500))
          crop.crop((0,0,crop.width,4700)).save('qa/poster-films-top.jpg',quality=92)
          crop.crop((0,4300,crop.width,crop.height)).save('qa/poster-films-bottom.jpg',quality=92)
          PY
      - name: Capture interactive lane
        run: |
          python -m http.server 8000 --directory StarWars >/tmp/histomap-http.log 2>&1 &
          python - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright

          async def shot(browser,name,width,height,scroll):
              page=await browser.new_page(viewport={'width':width,'height':height},device_scale_factor=1)
              await page.goto('http://127.0.0.1:8000/',wait_until='networkidle')
              await page.locator('[data-layer="screen"]').click()
              await page.wait_for_timeout(300)
              await page.locator('#map-scroll').evaluate(f'(el)=>el.scrollTop={scroll}')
              await page.wait_for_timeout(200)
              await page.screenshot(path=f'qa/{name}.png',full_page=False)
              await page.close()

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  await shot(browser,'web-desktop-clonewars',1440,900,930)
                  await shot(browser,'web-desktop-newrepublic',1440,900,2550)
                  await shot(browser,'web-mobile-clonewars',390,844,930)
                  await shot(browser,'web-mobile-newrepublic',390,844,2550)
                  await browser.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: starwars-films-tv-qa
          path: qa
          retention-days: 1
