name: Star Wars website-poster data sync

on:
  push:
    paths:
      - 'StarWars/data.js'
      - 'StarWars/expanded-data.js'
      - 'StarWars/lifelines.js'
      - 'StarWars/tools/poster/star-wars-poster-data.json'
      - 'StarWars/tools/poster/audit-data-sync.js'
      - '.github/workflows/starwars-data-sync.yml'
  pull_request:
    paths:
      - 'StarWars/data.js'
      - 'StarWars/expanded-data.js'
      - 'StarWars/lifelines.js'
      - 'StarWars/tools/poster/star-wars-poster-data.json'
      - 'StarWars/tools/poster/audit-data-sync.js'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare interactive and poster timeline data
        run: node StarWars/tools/poster/audit-data-sync.js
