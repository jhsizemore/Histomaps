name: Star Wars generated assets

on:
  push:
    branches: [main]
    paths:
      - 'StarWars/index.html'
      - 'StarWars/app.js'
      - 'StarWars/data.js'
      - 'StarWars/expanded-data.js'
      - 'StarWars/lifelines.js'
      - 'StarWars/recurring-lifelines.js'
      - 'StarWars/synopses.js'
      - 'StarWars/insignia.js'
      - 'StarWars/insignia-credits.json'
      - 'StarWars/title-art.js'
      - 'StarWars/title-art-credits.json'
      - 'StarWars/assets/starfield.webp'
      - 'StarWars/title-art/**'
      - 'StarWars/tools/poster/render.py'
      - 'StarWars/tools/poster/star-wars-poster-data.json'
      - 'StarWars/tools/poster/audit-data-sync.js'
      - 'StarWars/tools/poster/faction-symbols/**'
      - 'StarWars/tools/poster/title-art/**'
      - 'StarWars/tools/poster/star-wars-type/**'
      - 'StarWars/tools/social/render_social_card.py'
      - 'StarWars/tools/social/render_reddit_canon.py'
      - 'StarWars/tools/social/polish_reddit_svg.py'
      - '.github/workflows/starwars-generated-assets.yml'
  pull_request:
    paths:
      - 'StarWars/index.html'
      - 'StarWars/app.js'
      - 'StarWars/data.js'
      - 'StarWars/expanded-data.js'
      - 'StarWars/lifelines.js'
      - 'StarWars/recurring-lifelines.js'
      - 'StarWars/synopses.js'
      - 'StarWars/insignia.js'
      - 'StarWars/insignia-credits.json'
      - 'StarWars/title-art.js'
      - 'StarWars/title-art-credits.json'
      - 'StarWars/assets/starfield.webp'
      - 'StarWars/title-art/**'
      - 'StarWars/tools/poster/render.py'
      - 'StarWars/tools/poster/star-wars-poster-data.json'
      - 'StarWars/tools/poster/audit-data-sync.js'
      - 'StarWars/tools/poster/faction-symbols/**'
      - 'StarWars/tools/poster/title-art/**'
      - 'StarWars/tools/poster/star-wars-type/**'
      - 'StarWars/tools/social/render_social_card.py'
      - 'StarWars/tools/social/render_reddit_canon.py'
      - 'StarWars/tools/social/polish_reddit_svg.py'
      - '.github/workflows/starwars-generated-assets.yml'
  workflow_dispatch:

concurrency:
  group: starwars-generated-assets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: browser-actions/setup-chrome@v1

      - name: Validate interactive source and website-poster data sync
        run: |
          node --check StarWars/app.js
          node --check StarWars/recurring-lifelines.js
          node --check StarWars/synopses.js
          node StarWars/tools/poster/audit-data-sync.js
          python -m py_compile StarWars/tools/social/render_reddit_canon.py StarWars/tools/social/render_social_card.py StarWars/tools/social/polish_reddit_svg.py

      - name: Install image renderer
        run: python -m pip install --disable-pip-version-check pillow

      - name: Render full poster
        run: python StarWars/tools/poster/render.py

      - name: Render sharing and launch outputs
        run: python StarWars/tools/social/render_social_card.py

      - name: Validate generated assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          Image.MAX_IMAGE_PIXELS=None

          poster_path=Path('StarWars/downloads/Star-Wars-Histomap-Poster.png')
          reddit_svg_path=Path('StarWars/downloads/Star-Wars-Histomap-Reddit-Launch.svg')
          reddit_path=Path('StarWars/downloads/Star-Wars-Histomap-Reddit-Launch.png')
          social_path=Path('StarWars/assets/star-wars-histomap-social-card.png')
          preview_path=Path('StarWars/assets/star-wars-histomap-poster-preview.webp')
          for path in (poster_path, reddit_svg_path, reddit_path, social_path, preview_path):
              assert path.is_file(), path

          poster=Image.open(poster_path)
          assert poster.size==(5200,18220), poster.size
          assert poster.info.get('Website')=='https://histomaps.org/starwars/'
          assert 'https://histomaps.org/starwars/' in poster.info.get('Description','')

          svg=reddit_svg_path.read_text(encoding='utf-8')
          assert svg.lstrip().startswith('<svg'), 'Reddit source is not SVG'
          assert 'viewBox="0 0 1280 3840"' in svg
          assert 'width="3840"' in svg and 'height="11520"' in svg
          assert '<path' in svg and '<text' in svg, 'Expected vector chart geometry/text'
          assert 'font-family:StarJedi' in svg and '>histomap</text>' in svg, 'Histomap masthead must use Star Jedi'
          assert 'class="prop-kind"' not in svg, 'Individual property media-type labels should be removed'
          assert 'id="bottom-stories-polished"' in svg, 'Expected four-property Tales bottom bar'
          assert 'data:image/svg+xml;base64,' in svg, 'Expected embedded official Zero Company SVG lockup'
          assert reddit_svg_path.stat().st_size < 16 * 1024 * 1024, reddit_svg_path.stat().st_size

          renderer=Path('StarWars/tools/social/render_reddit_canon.py').read_text(encoding='utf-8')
          assert 'Star-Wars-Histomap-Poster.png' not in renderer, 'Reddit renderer must not crop the raster poster'

          reddit=Image.open(reddit_path)
          assert reddit.size==(3840,11520), reddit.size
          assert reddit.format=='PNG', reddit.format
          assert reddit_path.stat().st_size < 20 * 1024 * 1024, reddit_path.stat().st_size
          assert reddit.info.get('Website')=='https://histomaps.org/starwars/'
          assert 'Vector-source' in reddit.info.get('Description','')

          social=Image.open(social_path)
          assert social.size==(1200,630), social.size
          assert social.format=='PNG', social.format

          preview=Image.open(preview_path)
          assert preview.size==(900,3153), preview.size
          assert preview.format=='WEBP', preview.format

          print('poster', poster.size, poster_path.stat().st_size)
          print('reddit svg', reddit_svg_path.stat().st_size)
          print('reddit', reddit.size, reddit_path.stat().st_size)
          print('social', social.size, social_path.stat().st_size)
          print('web preview', preview.size, preview_path.stat().st_size)
          PY
          git diff --check

      - name: Upload generated outputs for QA
        uses: actions/upload-artifact@v4
        with:
          name: starwars-generated-assets-${{ github.sha }}
          path: |
            StarWars/downloads/Star-Wars-Histomap-Poster.png
            StarWars/downloads/Star-Wars-Histomap-Reddit-Launch.svg
            StarWars/downloads/Star-Wars-Histomap-Reddit-Launch.png
            StarWars/assets/star-wars-histomap-social-card.png
            StarWars/assets/star-wars-histomap-poster-preview.webp
          retention-days: 3

      - name: Commit changed generated assets on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          paths=(
            StarWars/downloads/Star-Wars-Histomap-Poster.png
            StarWars/downloads/Star-Wars-Histomap-Reddit-Launch.svg
            StarWars/downloads/Star-Wars-Histomap-Reddit-Launch.png
            StarWars/assets/star-wars-histomap-social-card.png
            StarWars/assets/star-wars-histomap-poster-preview.webp
          )
          if git diff --quiet -- "${paths[@]}" && git ls-files --error-unmatch StarWars/downloads/Star-Wars-Histomap-Reddit-Launch.svg StarWars/downloads/Star-Wars-Histomap-Reddit-Launch.png StarWars/assets/star-wars-histomap-poster-preview.webp >/dev/null 2>&1; then
            echo 'Generated assets already match source.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${paths[@]}"
          git commit -m 'Regenerate Star Wars launch assets'
          git fetch origin main
          git rebase origin/main
          git push
