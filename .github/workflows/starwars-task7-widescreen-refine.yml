name: Star Wars widescreen refinement

on:
  push:
    paths:
      - '.github/workflows/starwars-task7-widescreen-refine.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply ultrawide refinement
        run: python StarWars/tools/task7_widescreen_refine.py
      - name: Validate source
        run: |
          node --check StarWars/app.js
          grep -q "chartWidth>=2200" StarWars/app.js
          grep -q "@media(min-width:2800px)" StarWars/styles.css
      - name: Install browser QA package
        run: python -m pip install --disable-pip-version-check playwright
      - name: Capture QHD and ultrawide
        run: |
          mkdir -p qa
          python -m http.server 8000 --directory StarWars >/tmp/histomap-http.log 2>&1 &
          python - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          async def shot(browser,name,w,h):
              page=await browser.new_page(viewport={'width':w,'height':h},device_scale_factor=1)
              await page.goto('http://127.0.0.1:8000/',wait_until='networkidle')
              if await page.locator('#launch-intro').is_visible():
                  await page.locator('#launch-explore').click(); await page.wait_for_timeout(80)
              await page.locator('[data-layer="screen"]').click(); await page.wait_for_timeout(100)
              await page.screenshot(path=f'qa/{name}-films.png')
              fs=await page.locator('#map .ribbon-label').first.evaluate("el=>getComputedStyle(el).fontSize")
              symbols=await page.locator('#map .faction-insignia').count()
              print(name,'ribbon',fs,'symbols',symbols)
              await page.close()
          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(executable_path='/usr/bin/google-chrome')
                  await shot(browser,'qhd',2560,1440)
                  await shot(browser,'ultrawide',3440,1440)
                  await browser.close()
          asyncio.run(main())
          PY
      - name: Commit ultrawide refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add StarWars/styles.css StarWars/app.js
          git commit -m "Refine Star Wars ultrawide readability"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: starwars-task7-widescreen-refine-qa
          path: qa
          retention-days: 1
