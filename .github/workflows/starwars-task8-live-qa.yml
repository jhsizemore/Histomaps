name: Star Wars live canonical route QA

on:
  push:
    paths:
      - '.github/workflows/starwars-task8-live-qa.yml'

permissions:
  contents: read

jobs:
  live-route:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed route behavior
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 18); do
            root_code=$(curl -sS -o /tmp/root -w '%{http_code}' https://histomaps.org/starwars/ || true)
            old_headers=$(curl -sS -I https://histomaps.org/StarWars/ || true)
            old_code=$(printf '%s' "$old_headers" | awk 'toupper($1) ~ /^HTTP\// {c=$2} END{print c}')
            old_location=$(printf '%s' "$old_headers" | awk 'BEGIN{IGNORECASE=1} /^location:/ {gsub("\r",""); print $2}' | tail -1)
            if [[ "$root_code" == "200" ]] && grep -q 'https://histomaps.org/starwars/' /tmp/root && [[ "$old_code" == "301" ]] && [[ "$old_location" == "/starwars/" || "$old_location" == "https://histomaps.org/starwars/" ]]; then
              ok=1; break
            fi
            sleep 5
          done
          [[ "$ok" == "1" ]]

          check_redirect(){
            local url="$1"
            local h code loc
            h=$(curl -sS -I "$url")
            code=$(printf '%s' "$h" | awk 'toupper($1) ~ /^HTTP\// {c=$2} END{print c}')
            loc=$(printf '%s' "$h" | awk 'BEGIN{IGNORECASE=1} /^location:/ {gsub("\r",""); print $2}' | tail -1)
            echo "$url -> $code $loc"
            [[ "$code" == "301" ]]
            [[ "$loc" == "/starwars/" || "$loc" == "https://histomaps.org/starwars/" ]]
          }

          check_redirect https://histomaps.org/starwars
          check_redirect https://histomaps.org/StarWars/
          check_redirect https://histomaps.org/STARWARS/
          check_redirect https://histomaps.org/Starwars/
          check_redirect https://histomaps.org/starWars/

          code=$(curl -sS -o /dev/null -w '%{http_code}' https://histomaps.org/starwars/title-art/main.webp)
          echo "lowercase title-art asset -> $code"
          [[ "$code" == "200" ]]

          headers=$(curl -sS -I https://histomaps.org/starwars/downloads/Star-Wars-Histomap-Poster.png)
          code=$(printf '%s' "$headers" | awk 'toupper($1) ~ /^HTTP\// {c=$2} END{print c}')
          type=$(printf '%s' "$headers" | awk 'BEGIN{IGNORECASE=1} /^content-type:/ {gsub("\r",""); print $2}' | tail -1)
          echo "lowercase poster -> $code $type"
          [[ "$code" == "200" ]]
          [[ "$type" == image/png* ]]

          link=$(curl -sS -I https://histomaps.org/starwars/ | awk 'BEGIN{IGNORECASE=1} /^link:/ {sub(/^link:[ ]*/,""); gsub("\r",""); print}' | tail -1)
          echo "canonical Link header: $link"
          [[ "$link" == *'https://histomaps.org/starwars/'* ]]
