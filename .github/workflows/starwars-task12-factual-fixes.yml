name: Star Wars Task 12 factual fixes

on:
  push:
    paths:
      - '.github/workflows/starwars-task12-factual-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply current BBY-ABY reference dating
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root=Path('.')

          expanded=root/'StarWars/expanded-data.js'
          s=expanded.read_text()
          replacements={
            "  mandoFilmTiming:['The Mandalorian and Grogu chronology · Wookieepedia','https://starwars.fandom.com/wiki/Star_Wars%3A_The_Mandalorian_and_Grogu']\n":
            "  mandoFilmTiming:['The Mandalorian and Grogu chronology · Wookieepedia','https://starwars.fandom.com/wiki/Star_Wars%3A_The_Mandalorian_and_Grogu'],\n  yavinDating:['BBY/ABY dating convention · Wookieepedia','https://starwars.fandom.com/wiki/%27ABY-BBY%27_dating_system'],\n  andorFinaleTiming:['Andor Season 2 finale · BBY 1 · StarWars.com','https://www.starwars.com/news/andor-season-2-finale-episodes-10-11-12']\n",
            "  {id:'andor-tv',name:'Andor · seasons 1–2',kind:'series',start:-5,end:0,note:'Main story across the two seasons. Season 2 advances in year-separated arcs and ends immediately before Rogue One. Childhood flashbacks sit outside this span.',sources:['viewing','tvDates']},":
            "  {id:'andor-tv',name:'Andor · seasons 1–2',kind:'series',start:-5,end:-1,note:'Main story across the two seasons. Season 2 advances in year-separated arcs and its final arc is explicitly BBY 1, ending on the brink of Rogue One. Childhood flashbacks sit outside this span.',sources:['andorFinaleTiming','viewing','tvDates']},",
            "  {id:'rebels-tv',name:'Rebels',kind:'animation',start:-5,end:0,note:'The main rebellion narrative runs alongside Andor. Later epilogue scenes are not included in this continuous span.',sources:['viewing','tvDates']},":
            "  {id:'rebels-tv',name:'Rebels',kind:'animation',start:-5,end:-1,note:'The main rebellion narrative runs from 5 BBY through the Liberation of Lothal in 1 BBY. The later New Republic epilogue is not included in this continuous span.',sources:['viewing','tvDates']},",
            "  {id:'rogue-one',name:'Rogue One',kind:'film',start:0,end:0,note:'Main mission, immediately before A New Hope. The childhood opening is earlier.',sources:['dates']},":
            "  {id:'rogue-one',name:'Rogue One',kind:'film',start:-1,end:-1,note:'Main mission in 1 BBY, immediately before A New Hope and the Battle of Yavin. The childhood opening is earlier.',sources:['dates','yavinDating']},",
            "  {id:'ep4',name:'IV · A New Hope',kind:'film',start:0,end:0,note:'Contains the Battle of Yavin, the BBY/ABY reference point.',sources:['dates']},":
            "  {id:'ep4',name:'IV · A New Hope',kind:'film',start:-1,end:0,note:'Current reference chronology places the pre-Yavin events in 1 BBY; the Battle of Yavin itself is the zero point, with the immediate aftermath in 0 ABY.',sources:['dates','yavinDating']},"
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit('expanded-data target missing: '+old[:120])
              s=s.replace(old,new,1)
          expanded.write_text(s)

          data=root/'StarWars/data.js'
          s=data.read_text()
          replacements={
            "{id:'scarif',year:0,y:2045,title:'The sacrifice at Scarif',date:'0 BBY · before Yavin',level:2,faction:'rebels',text:'Rogue One secures and transmits the Death Star plans at the cost of the team’s lives.',effect:'A local operation creates the possibility of defeating the Empire’s greatest weapon.',media:['Rogue One · A Star Wars Story'],sources:['mothma','deathstar']}":
            "{id:'scarif',year:-1,y:2045,title:'The sacrifice at Scarif',date:'1 BBY · immediately before Yavin',level:2,faction:'rebels',text:'Rogue One secures and transmits the Death Star plans at the cost of the team’s lives.',effect:'A local operation creates the possibility of defeating the Empire’s greatest weapon.',media:['Rogue One · A Star Wars Story'],sources:['mothma','deathstar','yavinDating']}",
            "{id:'alderaan',year:0,y:2087,title:'Alderaan destroyed',date:'0 BBY · before Yavin',level:3,faction:'empire',text:'The Death Star destroys Alderaan in a demonstration of Imperial terror.',effect:'The regime’s promise of absolute control is made brutally visible.',media:['IV · A New Hope'],sources:['deathstar']}":
            "{id:'alderaan',year:-1,y:2087,title:'Alderaan destroyed',date:'1 BBY · before Yavin',level:3,faction:'empire',text:'The Death Star destroys Alderaan in a demonstration of Imperial terror.',effect:'The regime’s promise of absolute control is made brutally visible.',media:['IV · A New Hope'],sources:['deathstar','yavinDating']}",
            "{id:'yavin',year:0,title:'The Battle of Yavin',date:'0 · the calendar’s anchor',level:1,faction:'rebels',text:'Luke Skywalker destroys the first Death Star, saving the rebel base and demonstrating that the Empire can be defeated.',effect:'The rebellion gains a defining victory. This battle is the reference point for BBY and ABY dates.',media:['IV · A New Hope'],sources:['deathstar']}":
            "{id:'yavin',year:0,title:'The Battle of Yavin',date:'0 · the calendar’s anchor',level:1,faction:'rebels',text:'Luke Skywalker destroys the first Death Star, saving the rebel base and demonstrating that the Empire can be defeated.',effect:'The rebellion gains a defining victory. This battle is the zero reference point between BBY and ABY; there is no full 0 BBY year in the current convention used here.',media:['IV · A New Hope'],sources:['deathstar','yavinDating']}"
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit('data.js target missing: '+old[:120])
              s=s.replace(old,new,1)
          data.write_text(s)

          lives=root/'StarWars/lifelines.js'
          s=lives.read_text()
          old="    {id:'kenobi',name:'Obi-Wan Kenobi',short:'Obi-Wan',start:-57,end:0,endKind:'death',color:'#9cbacf',groups:['jedi'],wiki:'Obi-Wan_Kenobi',official:'obi-wan-kenobi',note:'Mentor to Anakin and Luke. This map uses the familiar Yavin-zero convention for A New Hope. Some newer reference chronologies label its pre-Yavin events 1 BBY. His physical life ends aboard the Death Star.'},"
          new="    {id:'kenobi',name:'Obi-Wan Kenobi',short:'Obi-Wan',start:-57,end:-1,endKind:'death',color:'#9cbacf',groups:['jedi'],wiki:'Obi-Wan_Kenobi',official:'obi-wan-kenobi',note:'Mentor to Anakin and Luke. Current reference chronology places his death aboard the Death Star before the Battle of Yavin in 1 BBY; the battle itself is the zero point.'},"
          if old not in s: raise SystemExit('Kenobi target missing')
          lives.write_text(s.replace(old,new,1))

          index=root/'StarWars/index.html'
          s=index.read_text()
          for old,new in [
              ('<script src="data.js" defer></script>','<script src="data.js?v=qa-20260907" defer></script>'),
              ('<script src="expanded-data.js" defer></script>','<script src="expanded-data.js?v=qa-20260907" defer></script>'),
              ('<script src="lifelines.js" defer></script>','<script src="lifelines.js?v=qa-20260907" defer></script>'),
              ('<script src="app.js?v=desktop-20260907" defer></script>','<script src="app.js?v=qa-20260907" defer></script>')
          ]:
              if old not in s: raise SystemExit('cache-bust target missing: '+old)
              s=s.replace(old,new,1)
          index.write_text(s)

          pdata=root/'StarWars/tools/poster/star-wars-poster-data.json'
          d=json.loads(pdata.read_text())
          d['sources']['yavinDating']=['BBY/ABY dating convention · Wookieepedia','https://starwars.fandom.com/wiki/%27ABY-BBY%27_dating_system']
          d['sources']['andorFinaleTiming']=['Andor Season 2 finale · BBY 1 · StarWars.com','https://www.starwars.com/news/andor-season-2-finale-episodes-10-11-12']
          screen={x['id']:x for x in d['screen']}
          screen['andor-tv'].update(end=-1,note='Main story across the two seasons. Season 2 advances in year-separated arcs and its final arc is explicitly BBY 1, ending on the brink of Rogue One. Childhood flashbacks sit outside this span.',sources=['andorFinaleTiming','viewing','tvDates'])
          screen['rebels-tv'].update(end=-1,note='The main rebellion narrative runs from 5 BBY through the Liberation of Lothal in 1 BBY. The later New Republic epilogue is not included in this continuous span.',sources=['viewing','tvDates'])
          screen['rogue-one'].update(start=-1,end=-1,note='Main mission in 1 BBY, immediately before A New Hope and the Battle of Yavin. The childhood opening is earlier.',sources=['dates','yavinDating'])
          screen['ep4'].update(start=-1,end=0,note='Current reference chronology places the pre-Yavin events in 1 BBY; the Battle of Yavin itself is the zero point, with the immediate aftermath in 0 ABY.',sources=['dates','yavinDating'])
          events={x['id']:x for x in d['events']}
          events['scarif'].update(year=-1,date='1 BBY · immediately before Yavin',sources=['mothma','deathstar','yavinDating'])
          events['alderaan'].update(year=-1,date='1 BBY · before Yavin',sources=['deathstar','yavinDating'])
          events['yavin'].update(effect='The rebellion gains a defining victory. This battle is the zero reference point between BBY and ABY; there is no full 0 BBY year in the current convention used here.',sources=['deathstar','yavinDating'])
          kenobi=next(x for x in d['lifelines'] if x['id']=='kenobi')
          kenobi.update(end=-1,note='Mentor to Anakin and Luke. Current reference chronology places his death aboard the Death Star before the Battle of Yavin in 1 BBY; the battle itself is the zero point.')
          pdata.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Validate corrected chronology
        run: |
          node --check StarWars/app.js
          node StarWars/tools/poster/audit-data-sync.js
          git diff --check
      - name: Commit current reference dating
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add StarWars/data.js StarWars/expanded-data.js StarWars/lifelines.js StarWars/index.html StarWars/tools/poster/star-wars-poster-data.json
          git commit -m 'Adopt current BBY-ABY reference dating'
          git push
